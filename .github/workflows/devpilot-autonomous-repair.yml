name: MYGRAM DevPilot Autonomous Repair

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-devpilot-autonomous-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check available configuration without exposing secrets
        id: config
        shell: bash
        env:
          MYGRAM_APP_TOKEN: ${{ secrets.MYGRAM_APP_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$MYGRAM_APP_TOKEN" && -n "$OPENAI_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Repair credentials are configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Repair is in report-only mode because one or more required secrets are missing."
          fi

      - name: Check out DevPilot engine
        uses: actions/checkout@v4
        with:
          ref: devpilot/auto-engine
          path: devpilot-engine
          persist-credentials: false

      - name: Check out MYGRAM app
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: MYGRAM-DB/mygram-app
          ref: main
          token: ${{ secrets.MYGRAM_APP_TOKEN }}
          path: mygram-app
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run baseline JavaScript syntax checks
        if: ${{ steps.config.outputs.enabled == 'true' }}
        id: baseline
        continue-on-error: true
        shell: bash
        working-directory: mygram-app
        run: |
          set -o pipefail
          : > "$GITHUB_WORKSPACE/check-output.txt"
          while IFS= read -r -d '' file; do
            if ! node --check "$file" 2>&1; then
              echo "Syntax check failed: $file" | tee -a "$GITHUB_WORKSPACE/check-output.txt"
              node --check "$file" 2>&1 | tee -a "$GITHUB_WORKSPACE/check-output.txt" || true
              exit 1
            fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Ask DevPilot for a repair proposal
        if: ${{ steps.config.outputs.enabled == 'true' && steps.baseline.outcome == 'failure' }}
        id: repair
        continue-on-error: true
        working-directory: devpilot-engine/devpilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_WORKDIR: ${{ github.workspace }}/mygram-app
          DEVPILOT_FAILURE_LOG: ${{ github.workspace }}/check-output.txt
        run: node src/agent.js

      - name: Re-run JavaScript syntax checks after proposed repair
        if: ${{ steps.config.outputs.enabled == 'true' && steps.baseline.outcome == 'failure' && steps.repair.outcome == 'success' }}
        id: verify
        continue-on-error: true
        shell: bash
        working-directory: mygram-app
        run: |
          set -o pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Write run summary
        if: always()
        shell: bash
        env:
          CONFIGURED: ${{ steps.config.outputs.enabled }}
          BASELINE: ${{ steps.baseline.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/devpilot-report"
          {
            echo "# MYGRAM DevPilot run report"
            echo
            echo "- UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Repair secrets configured: ${CONFIGURED:-unknown}"
            echo "- Baseline syntax checks: ${BASELINE:-not-run}"
            echo "- Repair agent step: ${REPAIR:-not-run}"
            echo "- Post-repair syntax checks: ${VERIFY:-not-run}"
            echo
            echo "This workflow does not publish a branch or pull request and does not deploy."
            echo "Only JavaScript syntax checks are currently configured; passing them is not a substitute for the full test suite."
          } | tee "$GITHUB_WORKSPACE/devpilot-report/report.md"
          if [[ -f "$GITHUB_WORKSPACE/check-output.txt" ]]; then
            cp "$GITHUB_WORKSPACE/check-output.txt" "$GITHUB_WORKSPACE/devpilot-report/check-output.txt"
          fi

      - name: Upload DevPilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mygram-devpilot-autonomous-report-${{ github.run_id }}
          path: devpilot-report/
          if-no-files-found: error
          retention-days: 14
